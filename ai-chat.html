<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ask AI</title>
    <link rel="stylesheet" href="/src/ai-chat.css" />
  </head>
  <body>
    <div class="resize-edge n" data-dir="North"></div>
    <div class="resize-edge s" data-dir="South"></div>
    <div class="resize-edge e" data-dir="East"></div>
    <div class="resize-edge w" data-dir="West"></div>
    <div class="resize-edge ne" data-dir="NorthEast"></div>
    <div class="resize-edge nw" data-dir="NorthWest"></div>
    <div class="resize-edge se" data-dir="SouthEast"></div>
    <div class="resize-edge sw" data-dir="SouthWest"></div>

    <div class="drag-strip" data-tauri-drag-region>
      <button class="bar-btn" id="sidebarToggleBtn" title="Chat history">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <select id="modelSelect" class="model-select" title="AI model" disabled>
        <option value="">No key set</option>
      </select>
      <div class="drag-strip-spacer"></div>
      <button class="bar-btn" id="newChatBtn" title="New chat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div class="layout">
      <nav class="sidebar" id="sidebar" hidden>
        <div class="session-list" id="sessionList"></div>
      </nav>

      <main class="main">
        <div class="thread" id="thread">
          <p class="empty" id="emptyHint">Ask anything, or attach something from Find first.</p>
        </div>

        <div class="gallery" id="gallery" hidden>
          <div class="gallery-head">
            <span>Choose from Find</span>
          </div>
          <div class="gallery-grid" id="galleryGrid"></div>
        </div>

        <footer class="composer-wrap">
          <img id="pendingThumb" class="pending-thumb" hidden />
          <div class="composer">
            <button id="attachBtn" class="pill-icon-btn" title="Choose from Find">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="8.5" cy="9.5" r="1.6" fill="currentColor"/><path d="M4.5 17l5-5 3.5 3.5L17 11l3 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="attachFileBtn" class="pill-icon-btn" title="Attach a file">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 8.5A2.5 2.5 0 0 1 6 6h4l2 2h6a2.5 2.5 0 0 1 2.5 2.5v6A2.5 2.5 0 0 1 18 19H6a2.5 2.5 0 0 1-2.5-2.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
            </button>
            <button id="attachLinkBtn" class="pill-icon-btn" title="Attach a link">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 14.5l5-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M11 8l1.5-1.5a3 3 0 0 1 4.24 4.24L15 12.5M13 16l-1.5 1.5a3 3 0 0 1-4.24-4.24L9 11.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            </button>
            <input id="textInput" type="text" placeholder="Type here…" autocomplete="off" spellcheck="false" />
            <button id="sendBtn" class="pill-icon-btn primary" title="Send">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 16-3-6-7-2z" fill="currentColor"/></svg>
            </button>
          </div>
        </footer>
      </main>
    </div>

    <script type="module" src="/src/ai-chat.ts"></script>
  </body>
</html>
