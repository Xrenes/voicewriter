<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" class="mark loading" id="mark" viewBox="0 0 200 200" role="img" aria-label="AudioWriter loading"><style>.piece{transform-box:fill-box;transform-origin:center bottom;animation:rise 2.4s cubic-bezier(.22,.8,.25,1) both}.second{animation-name:rise2}.third{animation-name:rise3}.stroke{animation-name:write;stroke-dasharray:1}.loading .piece{animation-iteration-count:infinite}@keyframes rise{0%,8%{transform:scaleY(.08);opacity:0}28%,100%{transform:none;opacity:1}}@keyframes rise2{0%,16%{transform:scaleY(.08);opacity:0}38%,100%{transform:none;opacity:1}}@keyframes rise3{0%,24%{transform:scaleY(.08);opacity:0}48%,100%{transform:none;opacity:1}}@keyframes write{0%,40%{stroke-dashoffset:1;opacity:0}41%{opacity:1}68%,100%{stroke-dashoffset:0;opacity:1}}@media(prefers-reduced-motion:reduce){.piece{animation:none!important;opacity:1;transform:none;stroke-dashoffset:0}}</style><rect width="200" height="200" fill="#E8C547"/><g class="assembly"><rect class="piece bar" x="22" y="100" width="28" height="66" rx="14" fill="#340016"/><rect class="piece bar second" x="58" y="72" width="28" height="94" rx="14" fill="#340016"/><path class="piece bar third" d="M108 38V139" fill="none" stroke="#340016" stroke-width="28" stroke-linecap="round"/><path class="piece stroke" d="M108 132V139Q108 166 137 166H172" fill="none" stroke="#340016" stroke-width="28" stroke-linecap="round" pathLength="1"/></g></svg>