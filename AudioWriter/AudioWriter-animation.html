<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AudioWriter animation</title>
<style>
:root{font-family:system-ui,sans-serif;color:#340016;background:#faf8f9}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center}.preview{text-align:center;padding:36px;width:min(100%,640px)}h1{font-size:22px;font-weight:550;letter-spacing:-.6px;margin:24px 0 8px}p{font-size:14px;color:#82757c;margin:0 0 36px}.stage{height:280px;display:grid;place-items:center}.mark{width:164px;height:164px;overflow:visible;color:inherit}.piece{transform-box:fill-box;transform-origin:center bottom;animation:rise 2.4s cubic-bezier(.22,.8,.25,1) both}.second{animation-name:rise2}.third{animation-name:rise3}.stroke{animation-name:write;stroke-dasharray:1}.loading .piece{animation-iteration-count:infinite}button{font:inherit;font-size:13px;padding:11px 17px;border:1px solid #ded3d9;border-radius:24px;background:transparent;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#340016;color:white;border-color:#340016}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}button:focus-visible{outline:3px solid #ac7890;outline-offset:4px}.dark{background:#181318;color:#f3d7e3}.dark p{color:#bcaab4}.dark button{border-color:#64515d}.dark button[aria-pressed=true]{background:#f3d7e3;color:#340016}small{display:block;margin-top:24px;font-size:12px;color:#82757c}
@keyframes rise{0%,8%{transform:scaleY(.08);opacity:0}28%,100%{transform:none;opacity:1}}@keyframes rise2{0%,16%{transform:scaleY(.08);opacity:0}38%,100%{transform:none;opacity:1}}@keyframes rise3{0%,24%{transform:scaleY(.08);opacity:0}48%,100%{transform:none;opacity:1}}@keyframes write{0%,40%{stroke-dashoffset:1;opacity:0}41%{opacity:1}68%,100%{stroke-dashoffset:0;opacity:1}}@media(prefers-reduced-motion:reduce){.piece{animation:none!important;opacity:1;transform:none;stroke-dashoffset:0}}</style></head><body><main class="preview"><div class="stage" id="stage"><svg class="mark" id="mark" viewBox="0 0 200 200" role="img" aria-label="AudioWriter loading"><g class="assembly"><rect class="piece bar" x="22" y="100" width="28" height="66" rx="14" fill="currentColor"/><rect class="piece bar second" x="58" y="72" width="28" height="94" rx="14" fill="currentColor"/><path class="piece bar third" d="M108 38V139" fill="none" stroke="currentColor" stroke-width="28" stroke-linecap="round"/><path class="piece stroke" d="M108 132V139Q108 166 137 166H172" fill="none" stroke="currentColor" stroke-width="28" stroke-linecap="round" pathLength="1"/></g></svg></div><h1>AudioWriter</h1><p id="description">A little sound. A written thought.</p><div class="controls"><button id="entry" aria-pressed="true">Replay entrance</button><button id="load" aria-pressed="false">Loading loop</button><button id="theme" aria-pressed="false">Dark background</button><button id="save">Download animated SVG</button></div><small>2.4-second entrance · Scalable · Respects reduced motion</small></main>
<script>
let looping=false;
function play(loop){looping=loop;const old=document.getElementById('mark');const next=old.cloneNode(true);next.classList.toggle('loading',loop);next.setAttribute('aria-label',loop?'AudioWriter loading':'AudioWriter');old.replaceWith(next);document.getElementById('entry').setAttribute('aria-pressed',String(!loop));document.getElementById('load').setAttribute('aria-pressed',String(loop));}
document.getElementById('entry').onclick=()=>play(false);document.getElementById('load').onclick=()=>play(true);document.getElementById('theme').onclick=function(){this.setAttribute('aria-pressed',String(document.body.classList.toggle('dark')))};
document.getElementById('save').onclick=()=>{const svg=document.getElementById('mark').cloneNode(true);svg.setAttribute('xmlns','http://www.w3.org/2000/svg');svg.setAttribute('width','200');svg.setAttribute('height','200');svg.style.color=document.body.classList.contains('dark')?'#f3d7e3':'#340016';const css=document.createElementNS('http://www.w3.org/2000/svg','style');css.textContent=Array.from(document.styleSheets[0].cssRules).filter(r=>r.cssText.includes('.piece')||r.cssText.includes('.assembly')||r.cssText.includes('.bar')||r.cssText.includes('.second')||r.cssText.includes('.third')||r.cssText.includes('.stroke')||r.cssText.includes('.loading')||r.cssText.startsWith('@keyframes')||r.cssText.startsWith('@media')).map(r=>r.cssText).join('\n');svg.prepend(css);const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml'}));const a=document.createElement('a');a.href=url;a.download=looping?'AudioWriter-loading.svg':'AudioWriter-entrance.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></body></html>
