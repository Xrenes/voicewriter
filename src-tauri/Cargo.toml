[package]
name = "voicewriter"
version = "5.5.0"
description = "Voice writing assistant"
authors = ["ifti237@gmail.com"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "voicewriter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libloading = "0.8"
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
once_cell = "1"

# Audio capture + resampling
cpal = "0.15"
rubato = "0.16"

# Audio playback (text-to-speech output). We write our own WAV headers for
# Kokoro's generated audio, but using the symphonia-backed decoder (not
# rodio's bundled `hound` decoder) keeps compatibility with any
# oddly-sized/streamed WAV headers, same as before.
rodio = { version = "0.19", default-features = false, features = ["symphonia-wav"] }

# Local text-to-speech (Kokoro-82M, ONNX Runtime inference). `ort` ships
# prebuilt ONNX Runtime binaries for Windows/Linux/macOS — no source compile.
ort = { version = "2.0.0-rc.13", default-features = false, features = ["ndarray", "std"] }
# `ort`'s `ndarray` feature requires 0.17; `ndarray-npy` 0.9 (below) depends
# on 0.16 internally and returns that version's array type from `by_name` —
# the two are aliased separately (see kokoro.rs's `use ndarray016`) and
# converted at the one point they meet (`VoiceTable::style_for`).
ndarray = "0.17"
ndarray016 = { package = "ndarray", version = "0.16" }
# Reads Kokoro's voices pack, an .npz archive (one .npy array per voice).
ndarray-npy = { version = "0.9", default-features = false, features = ["compressed_npz"] }

# Keystroke / clipboard injection into the focused field
enigo = { version = "0.6", features = ["serde"] }

# Groq API upload (multipart) + model download
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "multipart",
    "json",
    "rustls-tls",
] }

# Minimal WAV writer for the Groq upload
hound = "3"

# PNG encoding for screenshots/webcam captures (Find wedge) and base64 for
# sending images to Groq's vision model (AI chat wedge).
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

# Groq API key storage in the OS keychain (Windows Credential Manager / Secret Service)
keyring = { version = "3", features = ["windows-native", "sync-secret-service"] }

# Timestamps for usage counters
time = { version = "0.3", features = ["formatting"] }

# Opens URLs in the user's system default browser (Settings guide's
# sign-up/API-key links) — deliberately NOT the in-app Web browser, since
# those links are meant to go to the real account-management pages.
tauri-plugin-opener = "2.5.5"

# Raw Windows input injection (SendInput) — more compatible with Chromium/Electron
# fields than enigo for Ctrl+V and Unicode typing. Also used to force
# WS_EX_TOOLWINDOW directly on the Web browser window: Tauri's
# set_skip_taskbar() doesn't reliably stick on a window created via the
# `unstable` WindowBuilder API with child webviews added via add_child (see
# web_browser.rs) — a known class of GWL_EXSTYLE-clobbering bug upstream
# (tauri-apps/tauri#10422), so we set the style bit ourselves as a fallback.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
] }
raw-window-handle = "0.6"
# Windows links ONNX Runtime statically from ort's prebuilt binaries.
ort = { version = "2.0.0-rc.13", default-features = false, features = ["download-binaries", "tls-rustls"] }

# Webcam capture for the "Find" wedge's Camera option (Media Foundation
# backend on Windows).
nokhwa = { version = "0.10.11", features = ["input-msmf"] }

# Linux: X11 queries (cursor position, active window, held modifiers, root
# screenshot), the PRIMARY selection (selected text without sending Ctrl+C,
# which would kill a process in a terminal), and V4L2 webcam capture.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
arboard = "3"
nokhwa = { version = "0.10.11", features = ["input-v4l"] }
# Linux loads the bundled libonnxruntime.so at run time (see kokoro::init_runtime).
ort = { version = "2.0.0-rc.13", default-features = false, features = ["load-dynamic"] }

[dev-dependencies]
arboard = "3"
global-hotkey = "0.8"

[profile.release]
opt-level = "s"
strip = true

# Kokoro's array math is unusably slow unoptimised; optimise it even in
# `tauri dev` so local speech runs at near-release speed.
[profile.dev.package.ndarray]
opt-level = 3
[profile.dev.package.rubato]
opt-level = 3
