<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        width: 440px;
        height: 280px;
        overflow: hidden;
        background:
          radial-gradient(320px 240px at 80% 10%, rgba(214, 72, 108, 0.3), transparent 65%),
          radial-gradient(260px 200px at 0% 100%, rgba(178, 56, 89, 0.22), transparent 65%),
          #050506;
        color: #f2f2f3;
        font-family: "Segoe UI", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }
      img {
        width: 84px;
        height: 84px;
      }
      h1 {
        margin: 0;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        font-size: 16px;
        color: #b9b9bf;
      }
      p b {
        color: #d6486c;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <img src="../../icons/icon128.png" alt="" />
    <h1>VoiceWriter</h1>
    <p>SayIt <b>·</b> Dictate <b>·</b> Board <b>·</b> Refine</p>
  </body>
</html>
