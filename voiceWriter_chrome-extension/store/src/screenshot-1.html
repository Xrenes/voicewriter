<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="shared.css" />
    <style>
      .popup {
        width: 380px;
        height: 600px;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.08);
        flex: none;
        margin-right: 30px;
      }
      .popup img {
        width: 380px;
        height: 600px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="brand"><img src="../../icons/icon128.png" alt="" />VoiceWriter</div>
      <h1><em>SayIt.</em><br />Your voicemail<br />on one key.</h1>
      <p class="lead">Record it once. When the voicemail beeps, press <kbd>Alt+L</kbd> on any tab and your message plays straight into the call. Press again to stop.</p>
      <div class="pills">
        <span class="pill">Aloware · GoHighLevel · HubSpot</span>
        <span class="pill">Any web dialer you add</span>
      </div>
    </div>
    <div class="popup"><img src="popup.png" alt="" /></div>
  </body>
</html>
