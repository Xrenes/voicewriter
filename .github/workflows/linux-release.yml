name: Linux release build

# Built on Ubuntu 22.04 on purpose: a Linux binary only runs on distros whose
# glibc is the same age or newer than the build machine's, and 22.04 is the
# oldest Ubuntu that ships webkit2gtk-4.1 (required by Tauri 2). So these
# packages run on Ubuntu 22.04, 24.04, 26.04 and newer, plus Debian 12+,
# Linux Mint 21+, Pop!_OS 22.04+, and similar.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub release tag to attach the packages to (e.g. v0.5.0). Leave empty to only upload build artifacts."
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev libasound2-dev libdbus-1-dev \
            libclang-dev cmake libv4l-dev patchelf file rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch ONNX Runtime (glibc 2.28+, bundled with the app)
        run: |
          curl -sSLo ort.tgz https://github.com/microsoft/onnxruntime/releases/download/v1.22.0/onnxruntime-linux-x64-1.22.0.tgz
          echo "8344d55f93d5bc5021ce342db50f62079daf39aaafb5d311a451846228be49b3  ort.tgz" | sha256sum -c -
          tar xzf ort.tgz
          mkdir -p src-tauri/onnxruntime-linux
          cp onnxruntime-linux-x64-1.22.0/lib/libonnxruntime.so.1.22.0 src-tauri/onnxruntime-linux/libonnxruntime.so

      - name: Run tests
        working-directory: src-tauri
        run: cargo test

      - name: Build packages
        run: npx tauri build

      - name: Collect packages
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/deb/*.deb out/
          cp src-tauri/target/release/bundle/appimage/*.AppImage out/
          cp src-tauri/target/release/bundle/rpm/*.rpm out/
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: voicewriter-linux
          path: out/*

      - name: Attach to release
        if: github.event_name == 'push' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: gh release upload "$TAG" out/* --clobber
